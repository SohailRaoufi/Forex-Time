name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Check release versions
        run: node scripts/release-artifacts.mjs validate
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Build installer
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Forex Time.app"
          hdiutil verify src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - name: Collect installer
        run: node scripts/release-artifacts.mjs collect ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/release-artifacts.mjs checksums
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published binaries."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "Forex Time $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
